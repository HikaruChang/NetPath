[package]
authors = ["Hikaru <i@rua.moe>"]
description = "High-performance multi-WAN load balancer and failover manager using nftables"
edition = "2021"
license = "LicenseRef-NonCommercial"
name = "netpath"
repository = "https://github.com/hikaruchang/netpath"
version = "1.0.0"

[dependencies]
# Async runtime (updated for OpenWrt 23.05+)
tokio = {version = "1.40", features = ["full"]}

# Serialization
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}

# Network utilities
dns-lookup = "2.0"

# Configuration
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Command execution
which = "6.0"

# Time
chrono = {version = "0.4", features = ["serde"]}

# Async utilities
futures = "0.3"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.20"
nftables = "0.4"
nix = {version = "0.29", features = ["signal", "net", "socket"]}
pnet = "0.35"
rtnetlink = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
